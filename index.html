<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive iPhone-inspired calculator.">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" aria-label="Calculator">
        <div class="calculator-header">
            <span class="calculator-title">Calculator</span>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme">☀</button>
        </div>
        <output class="display" id="display" aria-live="polite" aria-label="Calculator display">0</output>
        <div class="buttons" aria-label="Calculator buttons">
            <button class="btn function" data-action="clear" type="button">AC</button>
            <button class="btn function" data-action="toggle-sign" type="button" aria-label="Toggle sign">±</button>
            <button class="btn function" data-value="%" type="button">%</button>
            <button class="btn operator" data-value="/" type="button" aria-label="Divide">÷</button>

            <button class="btn" data-value="7" type="button">7</button>
            <button class="btn" data-value="8" type="button">8</button>
            <button class="btn" data-value="9" type="button">9</button>
            <button class="btn operator" data-value="*" type="button" aria-label="Multiply">×</button>

            <button class="btn" data-value="4" type="button">4</button>
            <button class="btn" data-value="5" type="button">5</button>
            <button class="btn" data-value="6" type="button">6</button>
            <button class="btn operator" data-value="-" type="button" aria-label="Subtract">−</button>

            <button class="btn" data-value="1" type="button">1</button>
            <button class="btn" data-value="2" type="button">2</button>
            <button class="btn" data-value="3" type="button">3</button>
            <button class="btn operator" data-value="+" type="button" aria-label="Add">+</button>

            <button class="btn zero" data-value="0" type="button">0</button>
            <button class="btn" data-value="." type="button" aria-label="Decimal point">.</button>
            <button class="btn equal" data-action="calculate" type="button">=</button>
        </div>
        <p class="keyboard-hint">Keyboard supported: 0-9, +, −, ×, ÷, %, Enter, Escape, Backspace</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
